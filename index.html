<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#6c5ce7" />
<title>Kal — мессенджер</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"Kal","short_name":"Kal","description":"Мессенджер Kal","start_url":"/","display":"standalone","background_color":"%230e0e11","theme_color":"%236c5ce7","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/5968/5968841.png","sizes":"512x512","type":"image/png"}]}'>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0e0e11; --panel: #17171c; --panel-2: #1e1e26;
  --accent: #6c5ce7; --accent-hover: #8172ff;
  --text: #f0f0f5; --text-dim: #8a8a99; --border: #26262f;
  --msg-own: #6c5ce7; --msg-other: #23232d;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
.hidden { display: none !important; }

.auth-screen { height: 100vh; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 50% 30%, #1d1b33, #0e0e11 70%); padding: 20px; }
.auth-card { background: var(--panel); padding: 30px 24px; border-radius: 24px;
  width: 100%; max-width: 380px; text-align: center; border: 1px solid var(--border);
  box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.logo-big { width: 72px; height: 72px; margin: 0 auto 16px;
  background: linear-gradient(135deg, var(--accent), #a29bfe); border-radius: 20px;
  display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 800; }
.auth-card h1 { font-size: 28px; margin-bottom: 6px; }
.subtitle { color: var(--text-dim); font-size: 14px; margin-bottom: 20px; }
.auth-card input { width: 100%; padding: 14px 16px; background: var(--panel-2);
  border: 1px solid var(--border); border-radius: 12px; color: var(--text);
  font-size: 16px; margin-bottom: 12px; outline: none; }
.auth-card input:focus { border-color: var(--accent); }
.input-hint { font-size: 12px; color: var(--text-dim); text-align: left; margin: -6px 0 12px 4px; }
.btn-primary { width: 100%; padding: 14px; background: var(--accent); color: #fff;
  border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: .2s; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.btn-secondary { width: 100%; padding: 14px; background: transparent; color: var(--text-dim);
  border: none; font-size: 14px; cursor: pointer; margin-top: 10px; }
.btn-secondary:hover { color: var(--text); }
.err { color: #ff6b6b; font-size: 13px; margin-bottom: 12px; min-height: 16px; }

.app { display: flex; flex-direction: column; height: 100vh; position: relative; }
.main-content { flex: 1; display: flex; overflow: hidden; }

.bottom-nav {
  display: flex; justify-content: space-around; align-items: center;
  background: var(--panel); border-top: 1px solid var(--border);
  padding: 8px 0; z-index: 100; flex-shrink: 0;
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  color: var(--text-dim); font-size: 12px; cursor: pointer; padding: 8px 24px;
  border-radius: 12px; transition: 0.2s;
}
.nav-item.active { color: var(--accent); }
.nav-item .icon { font-size: 20px; }
.netlify-badge {
  background: #00c7b7; color: #fff; padding: 6px 12px; border-radius: 20px;
  font-size: 11px; font-weight: bold; display: flex; align-items: center; gap: 4px;
  cursor: pointer; text-decoration: none;
}

.tab-content { flex: 1; display: flex; width: 100%; height: 100%; }
.chats-tab { width: 320px; background: var(--panel); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0; }
.chats-tab-header { display: flex; align-items: center; gap: 10px; padding: 16px;
  border-bottom: 1px solid var(--border); }
.logo { width: 34px; height: 34px; background: linear-gradient(135deg, var(--accent), #a29bfe);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 18px; }
.app-name { font-weight: 700; font-size: 18px; flex: 1; }
.user-tag { font-size: 12px; color: var(--text-dim); display: block; }
.icon-btn { background: transparent; border: none; color: var(--text-dim);
  font-size: 18px; cursor: pointer; padding: 6px; border-radius: 8px; }
.icon-btn:hover { background: var(--panel-2); color: var(--text); }
.search-box { padding: 12px 16px 6px; }
.search-box input { width: 100%; padding: 10px 14px; background: var(--panel-2);
  border: 1px solid var(--border); border-radius: 10px; color: var(--text);
  outline: none; font-size: 14px; }
.search-box input:focus { border-color: var(--accent); }
.search-results { padding: 0 8px 8px; max-height: 240px; overflow-y: auto; }
.search-results .result-item { display: flex; align-items: center; gap: 10px;
  padding: 10px; border-radius: 10px; cursor: pointer; margin-bottom: 2px; }
.search-results .result-item:hover { background: var(--panel-2); }
.search-results .avatar { width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, #6c5ce7, #a29bfe); display: flex;
  align-items: center; justify-content: center; font-weight: 700; font-size: 14px; overflow: hidden; }
.search-results .result-meta { flex: 1; min-width: 0; }
.search-results .result-meta h4 { font-size: 14px; }
.search-results .result-meta span { font-size: 12px; color: var(--text-dim); }
.no-result { text-align: center; color: var(--text-dim); font-size: 13px; padding: 12px; }
.chats-label { padding: 12px 16px 4px; font-size: 11px; text-transform: uppercase;
  letter-spacing: 1px; color: var(--text-dim); font-weight: 600; }
.chats-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
.chat-item { display: flex; align-items: center; gap: 12px; padding: 12px;
  border-radius: 12px; cursor: pointer; transition: .15s; margin-bottom: 2px; }
.chat-item:hover, .chat-item.active { background: var(--panel-2); }
.chat-item .avatar { width: 44px; height: 44px; border-radius: 50%;
  background: linear-gradient(135deg, #6c5ce7, #a29bfe); display: flex;
  align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; overflow: hidden; }
.chat-item .chat-meta { flex: 1; min-width: 0; }
.chat-item .chat-meta h4 { font-size: 15px; margin-bottom: 3px; }
.chat-item .chat-meta p { font-size: 13px; color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg); min-width: 0; }
.empty-state { flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; color: var(--text-dim); padding: 20px; text-align: center; }
.empty-logo { width: 80px; height: 80px; background: linear-gradient(135deg, var(--accent), #a29bfe);
  border-radius: 24px; display: flex; align-items: center; justify-content: center;
  font-size: 40px; font-weight: 800; color: #fff; margin-bottom: 20px; }
.empty-state h2 { color: var(--text); margin-bottom: 8px; }
.chat-view { flex: 1; display: flex; flex-direction: column; height: 100%; min-height: 0; }
.chat-header { display: flex; align-items: center; gap: 12px;
  padding: 12px 20px; border-bottom: 1px solid var(--border);
  background: var(--panel); flex-shrink: 0; }
.chat-header .avatar { width: 42px; height: 42px; border-radius: 50%;
  background: linear-gradient(135deg, #6c5ce7, #a29bfe); display: flex;
  align-items: center; justify-content: center; font-weight: 700; overflow: hidden; }
.chat-info { flex: 1; min-width: 0; }
.chat-info h3 { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-info span { font-size: 13px; color: var(--text-dim); }
.messages { flex: 1; overflow-y: auto; padding: 20px;
  display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.message { max-width: 75%; padding: 10px 14px; border-radius: 16px;
  font-size: 15px; line-height: 1.4; word-wrap: break-word; animation: pop .2s ease; }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.message.own { align-self: flex-end; background: var(--msg-own); border-bottom-right-radius: 4px; }
.message.other { align-self: flex-start; background: var(--msg-other); border-bottom-left-radius: 4px; }
.message .time { font-size: 11px; opacity: .7; margin-top: 4px; display: block; text-align: right; }
.composer { display: flex; gap: 10px; padding: 14px 20px;
  border-top: 1px solid var(--border); background: var(--panel); flex-shrink: 0; }
.composer input { flex: 1; padding: 12px 16px; background: var(--panel-2);
  border: 1px solid var(--border); border-radius: 12px; color: var(--text);
  outline: none; font-size: 16px; min-width: 0; }
.composer input:focus { border-color: var(--accent); }
.btn-send { width: 46px; height: 46px; border-radius: 12px; border: none;
  background: var(--accent); color: #fff; font-size: 18px; cursor: pointer;
  transition: .2s; flex-shrink: 0; }
.btn-send:hover { background: var(--accent-hover); }

.profile-tab { flex: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; overflow-y: auto; }
.profile-avatar-wrap { position: relative; width: 120px; height: 120px; margin-bottom: 20px; cursor: pointer; }
.profile-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent); }
.profile-avatar-placeholder { width: 100%; height: 100%; border-radius: 50%; background: var(--panel-2); display: flex; align-items: center; justify-content: center; font-size: 40px; border: 3px solid var(--accent); }
.profile-avatar-edit { position: absolute; bottom: 0; right: 0; background: var(--accent); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid var(--panel); }
.profile-form { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
.profile-input-group { display: flex; flex-direction: column; gap: 5px; }
.profile-input-group label { font-size: 13px; color: var(--text-dim); margin-left: 4px; }
.profile-input-group input { padding: 14px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 16px; outline: none; }
.profile-input-group input:focus { border-color: var(--accent); }
.profile-actions { margin-top: 20px; display: flex; gap: 10px; width: 100%; }
.btn-danger { background: #ff6b6b; color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 600; cursor: pointer; width: 100%; }

.in-app-notification {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
  background: var(--panel-2); border: 1px solid var(--accent); border-radius: 12px;
  padding: 12px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  z-index: 9999; display: flex; align-items: center; gap: 12px;
  transition: transform 0.3s ease; min-width: 280px; max-width: 90%; cursor: pointer;
}
.in-app-notification.show { transform: translateX(-50%) translateY(0); }
.in-app-notification .avatar { width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, #6c5ce7, #a29bfe); display: flex;
  align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; overflow: hidden; }
.in-app-notification .text { flex: 1; overflow: hidden; }
.in-app-notification .text h4 { font-size: 14px; margin-bottom: 2px; }
.in-app-notification .text p { font-size: 13px; color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: #2a2a35; border-radius: 3px; }

@media (max-width: 700px) {
  .chats-tab { width: 100%; }
  .chat-area { display: none; }
  .app.chat-open .chats-tab { display: none; }
  .app.chat-open .chat-area { display: flex; }
  .chat-header::before { content: "‹"; font-size: 28px; color: var(--accent);
    cursor: pointer; margin-right: 6px; line-height: 1; }
  .app.chat-open .bottom-nav { display: none; }
}
</style>
</head>
<body>

<div id="registerScreen" class="auth-screen hidden">
  <div class="auth-card">
    <div class="logo-big">K</div>
    <h1>Регистрация</h1>
    <p class="subtitle">Создай свой аккаунт</p>
    <input type="text" id="regName" placeholder="Ваше имя" maxlength="20" />
    <input type="text" id="regUsername" placeholder="username (латиницей)" maxlength="15" />
    <input type="email" id="regEmail" placeholder="Email (почта)" />
    <input type="password" id="regPassword" placeholder="Пароль" />
    <div class="err" id="regErr"></div>
    <button id="registerBtn" class="btn-primary">Зарегистрироваться</button>
    <button id="goToLogin" class="btn-secondary">Уже есть аккаунт? Войти</button>
  </div>
</div>

<div id="loginScreen" class="auth-screen hidden">
  <div class="auth-card">
    <div class="logo-big">K</div>
    <h1>Вход</h1>
    <p class="subtitle">Войди в свой аккаунт</p>
    <input type="email" id="logEmail" placeholder="Email (почта)" />
    <input type="password" id="logPassword" placeholder="Пароль" />
    <div class="err" id="logErr"></div>
    <button id="loginBtn" class="btn-primary">Войти</button>
    <button id="goToRegister" class="btn-secondary">Нет аккаунта? Зарегистрироваться</button>
  </div>
</div>

<div id="app" class="app hidden">
  <div class="main-content">
    <div id="chatsTab" class="tab-content">
      <aside class="chats-tab">
        <div class="chats-tab-header">
          <div class="logo">K</div>
          <div style="flex:1">
            <span class="app-name">Kal</span>
            <span class="user-tag" id="myTag"></span>
          </div>
        </div>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Найти @username..." />
        </div>
        <div class="search-results hidden" id="searchResults"></div>
        <div class="chats-label">Чаты</div>
        <div class="chats-list" id="chatsList"></div>
      </aside>

      <main class="chat-area" id="chatArea">
        <div id="emptyState" class="empty-state">
          <div class="empty-logo">K</div>
          <h2>Добро пожаловать в Kal</h2>
          <p>Найдите человека по @username в поиске</p>
        </div>
        <div id="chatView" class="chat-view hidden">
          <header class="chat-header" id="chatHeader">
            <div class="avatar" id="chatAvatar">?</div>
            <div class="chat-info">
              <h3 id="chatName">Чат</h3>
              <span id="chatUsername"></span>
            </div>
          </header>
          <div class="messages" id="messages"></div>
          <footer class="composer">
            <input type="text" id="messageInput" placeholder="Написать сообщение..." autocomplete="off" />
            <button id="sendBtn" class="btn-send">➤</button>
          </footer>
        </div>
      </main>
    </div>

    <div id="profileTab" class="tab-content hidden">
      <div class="profile-tab">
        <div class="profile-avatar-wrap" id="avatarClickArea">
          <img id="myAvatarImg" class="profile-avatar hidden" />
          <div id="myAvatarPlaceholder" class="profile-avatar-placeholder">👤</div>
          <div class="profile-avatar-edit">📷</div>
        </div>
        <input type="file" id="avatarInput" accept="image/*" class="hidden" />
        
        <div class="profile-form">
          <div class="profile-input-group">
            <label>Имя</label>
            <input type="text" id="profileName" placeholder="Ваше имя" maxlength="20" />
          </div>
          <div class="profile-input-group">
            <label>Username</label>
            <input type="text" id="profileUsername" placeholder="username" maxlength="15" />
          </div>
          <div class="profile-actions">
            <button id="saveProfileBtn" class="btn-primary">Сохранить</button>
          </div>
          <div class="profile-actions" style="margin-top: 10px;">
             <button id="logoutBtn" class="btn-danger">Выйти из аккаунта</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-nav" id="bottomNav">
    <div class="nav-item active" id="navChats">
      <span class="icon">💬</span>
      <span>Чаты</span>
    </div>
    <div class="nav-item" id="navProfile">
      <span class="icon">👤</span>
      <span>Профиль</span>
    </div>
    <a href="https://netlify.com" target="_blank" class="netlify-badge">
      <span>⚡</span> Netlify
    </a>
  </div>
</div>

<div id="notificationContainer"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, getDoc, getDocs, query, where, addDoc, orderBy, onSnapshot, serverTimestamp, limit } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDPyoYEsvZTvSSaVUb7pKDyAJzpZLxE3fk",
  authDomain: "kal-is.firebaseapp.com",
  projectId: "kal-is",
  storageBucket: "kal-is.firebasestorage.app",
  messagingSenderId: "267978238420",
  appId: "1:267978238420:web:09f37b1e3a50e3398cce41",
  measurementId: "G-SDY8CJM1CC"
};

const IMGBB_API_KEY = 'aee3e1e7e8b54285d474846e3092dbbe';

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = (id) => document.getElementById(id);
const isValidUsername = (u) => /^[a-zA-Z0-9_]{3,15}$/.test(u);
const escapeHtml = (str) => String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
const chatIdFor = (a, b) => [a, b].sort().join('__');

const state = { uid: null, me: null, contacts: {}, activeUser: null, unsubMessages: null, unsubAllChats: null };

function showInAppNotification(title, body, senderUsername, senderAvatar) {
  const container = $('notificationContainer');
  const el = document.createElement('div');
  el.className = 'in-app-notification';
  const avatarHtml = senderAvatar 
    ? `<div class="avatar"><img src="${senderAvatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;"></div>`
    : `<div class="avatar">${title.charAt(0).toUpperCase()}</div>`;
    
  el.innerHTML = `
    ${avatarHtml}
    <div class="text">
      <h4>${escapeHtml(title)}</h4>
      <p>${escapeHtml(body)}</p>
    </div>
  `;
  el.onclick = async () => {
    el.remove();
    await loadUserAndOpenChat(senderUsername);
  };
  container.appendChild(el);
  setTimeout(() => el.classList.add('show'), 100);
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 5000);
}

async function loadUserAndOpenChat(username) {
  if (!state.contacts[username]) {
    const usersRef = collection(db, 'users');
    const q = query(usersRef, where('username', '==', username));
    const snap = await getDocs(q);
    if (!snap.empty) state.contacts[username] = snap.docs[0].data();
    else return;
  }
  await openChat(username);
  renderChats();
}

onAuthStateChanged(auth, async (user) => {
  if (user) {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (snap.exists()) {
      const d = snap.data();
      state.uid = user.uid;
      state.me = { uid: user.uid, name: d.name, username: d.username, avatarUrl: d.avatarUrl || '' };
      enterApp();
      return;
    }
  }
  $('app').classList.add('hidden');
  $('registerScreen').classList.remove('hidden');
  initAuthLogic();
});

function initAuthLogic() {
  $('goToLogin').onclick = () => { $('registerScreen').classList.add('hidden'); $('loginScreen').classList.remove('hidden'); };
  $('goToRegister').onclick = () => { $('loginScreen').classList.add('hidden'); $('registerScreen').classList.remove('hidden'); };

  $('registerBtn').onclick = async () => {
    const name = $('regName').value.trim();
    const username = $('regUsername').value.trim().toLowerCase();
    const email = $('regEmail').value.trim();
    const password = $('regPassword').value;
    const err = $('regErr');
    err.textContent = '';
    
    if (!name) { err.textContent = 'Введите имя'; return; }
    if (!isValidUsername(username)) { err.textContent = 'Username: 3–15 символов, латиница, цифры, _'; return; }
    if (!email || !password) { err.textContent = 'Введите email и пароль'; return; }

    $('registerBtn').disabled = true;
    $('registerBtn').textContent = 'Регистрация...';

    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      const uid = cred.user.uid;
      const unameRef = doc(db, 'usernames', username);
      const unameSnap = await getDoc(unameRef);
      if (unameSnap.exists()) {
        err.textContent = 'Этот username уже занят.';
        await signOut(auth); return;
      }
      await setDoc(doc(db, 'users', uid), { uid, name, username, email, createdAt: serverTimestamp(), avatarUrl: '' });
      await setDoc(unameRef, { uid });
      state.uid = uid;
      state.me = { uid, name, username, avatarUrl: '' };
      enterApp();
    } catch (e) {
      err.textContent = 'Ошибка: ' + (e.message || 'попробуй ещё раз');
    } finally {
      $('registerBtn').disabled = false;
      $('registerBtn').textContent = 'Зарегистрироваться';
    }
  };

  $('loginBtn').onclick = async () => {
    const email = $('logEmail').value.trim();
    const password = $('logPassword').value;
    const err = $('logErr');
    err.textContent = '';
    if (!email || !password) { err.textContent = 'Введите email и пароль'; return; }
    $('loginBtn').disabled = true;
    $('loginBtn').textContent = 'Вход...';
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (e) {
      err.textContent = 'Неверный email или пароль';
    } finally {
      $('loginBtn').disabled = false;
      $('loginBtn').textContent = 'Войти';
    }
  };

  $('regUsername').addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/[^a-zA-Z0-9_]/g, '').toLowerCase();
  });
}

function enterApp() {
  $('registerScreen').classList.add('hidden');
  $('loginScreen').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('myTag').textContent = '@' + state.me.username;
  
  if ("Notification" in window && Notification.permission !== "granted") {
    Notification.requestPermission();
  }

  bindSearch();
  bindComposer();
  bindTabs();
  bindProfile();
  listenToAllChats();
  loadExistingChats();
  fillProfileData();
}

function bindTabs() {
  $('navChats').onclick = () => {
    $('navChats').classList.add('active'); $('navProfile').classList.remove('active');
    $('chatsTab').classList.remove('hidden'); $('profileTab').classList.add('hidden');
  };
  $('navProfile').onclick = () => {
    $('navProfile').classList.add('active'); $('navChats').classList.remove('active');
    $('profileTab').classList.remove('hidden'); $('chatsTab').classList.add('hidden');
    fillProfileData();
  };
}

function fillProfileData() {
  $('profileName').value = state.me.name;
  $('profileUsername').value = state.me.username;
  if (state.me.avatarUrl) {
    $('myAvatarImg').src = state.me.avatarUrl;
    $('myAvatarImg').classList.remove('hidden');
    $('myAvatarPlaceholder').classList.add('hidden');
  } else {
    $('myAvatarImg').classList.add('hidden');
    $('myAvatarPlaceholder').classList.remove('hidden');
  }
}

function bindProfile() {
  $('avatarClickArea').onclick = () => $('avatarInput').click();
  
  $('avatarInput').onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = (ev) => {
      $('myAvatarImg').src = ev.target.result;
      $('myAvatarImg').classList.remove('hidden');
      $('myAvatarPlaceholder').classList.add('hidden');
    };
    reader.readAsDataURL(file);
    
    try {
      const formData = new FormData();
      formData.append('image', file);
      
      const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
        method: 'POST',
        body: formData
      });
      const data = await res.json();
      if (data.success) {
        const url = data.data.url;
        await setDoc(doc(db, 'users', state.uid), { avatarUrl: url }, { merge: true });
        state.me.avatarUrl = url;
        alert('Аватарка обновлена!');
      } else {
        alert('Ошибка загрузки фото');
      }
    } catch (err) {
      console.error(err);
      alert('Ошибка загрузки фото');
    }
  };

  $('saveProfileBtn').onclick = async () => {
    const newName = $('profileName').value.trim();
    const newUsername = $('profileUsername').value.trim().toLowerCase();
    
    if (!newName) return alert('Введите имя');
    if (!isValidUsername(newUsername)) return alert('Некорректный username');

    if (newUsername !== state.me.username) {
      const unameRef = doc(db, 'usernames', newUsername);
      const unameSnap = await getDoc(unameRef);
      if (unameSnap.exists()) return alert('Этот username уже занят');
      
      await setDoc(unameRef, { uid: state.uid });
      await setDoc(doc(db, 'users', state.uid), { name: newName, username: newUsername }, { merge: true });
      state.me.name = newName;
      state.me.username = newUsername;
      $('myTag').textContent = '@' + newUsername;
    } else {
      await setDoc(doc(db, 'users', state.uid), { name: newName }, { merge: true });
      state.me.name = newName;
    }
    alert('Профиль обновлен!');
  };

  $('logoutBtn').onclick = doLogout;
}

async function loadExistingChats() {
  const chatsRef = collection(db, 'chats');
  const q = query(chatsRef, where('users', 'array-contains', state.uid));
  const snap = await getDocs(q);
  
  snap.forEach(d => {
    const data = d.data();
    const otherUid = data.users.find(u => u !== state.uid);
    const otherUsername = data[`uname_${otherUid}`];
    const otherName = data[`name_${otherUid}`];
    if (otherUsername) {
      state.contacts[otherUsername] = { uid: otherUid, name: otherName, username: otherUsername, avatarUrl: data[`avatar_${otherUid}`] || '' };
    }
  });
  renderChats();
}

async function listenToAllChats() {
  const chatsRef = collection(db, 'chats');
  const q = query(chatsRef, where('users', 'array-contains', state.uid));
  
  state.unsubAllChats = onSnapshot(q, (snap) => {
    snap.docChanges().forEach((change) => {
      if (change.type === 'modified' || change.type === 'added') {
        const data = change.doc.data();
        const chatId = change.doc.id;
        
        const senderUid = data.users.find(u => u !== state.uid);
        const senderName = data[`name_${senderUid}`] || 'Новое сообщение';
        const senderUsername = data[`uname_${senderUid}`];
        const senderAvatar = data[`avatar_${senderUid}`] || '';
        
        if (senderUsername && !state.contacts[senderUsername]) {
           state.contacts[senderUsername] = { uid: senderUid, name: senderName, username: senderUsername, avatarUrl: senderAvatar };
           renderChats();
        }

        const expectedChatId = state.activeUser ? chatIdFor(state.uid, state.contacts[state.activeUser]?.uid) : '';
        
        if (data.lastTs && chatId !== expectedChatId) {
          showInAppNotification(senderName, data.lastText || 'Прислал(а) сообщение', senderUsername, senderAvatar);
        }
      }
    });
  });
}

async function doLogout() {
  if (state.unsubMessages) state.unsubMessages();
  if (state.unsubAllChats) state.unsubAllChats();
  await signOut(auth);
  location.reload();
}

async function searchUsers(q) {
  const clean = q.trim().toLowerCase().replace(/^@/, '');
  if (!clean) return [];
  const usersRef = collection(db, 'users');
  const q1 = query(usersRef, where('username', '>=', clean), where('username', '<=', clean + '\uf8ff'), limit(10));
  const snap = await getDocs(q1);
  const results = [];
  snap.forEach(d => {
    const u = d.data();
    if (u.username !== state.me.username) results.push(u);
  });
  return results;
}

function bindSearch() {
  const input = $('searchInput');
  const box = $('searchResults');
  input.oninput = async () => {
    const q = input.value;
    if (!q.trim()) { box.classList.add('hidden'); box.innerHTML = ''; return; }
    box.classList.remove('hidden');
    box.innerHTML = '<p class="no-result">Поиск...</p>';
    try {
      const results = await searchUsers(q);
      if (results.length === 0) {
        box.innerHTML = '<p class="no-result">Никого не найдено 😕</p>'; return;
      }
      box.innerHTML = '';
      results.forEach(u => {
        const el = document.createElement('div');
        el.className = 'result-item';
        const avHtml = u.avatarUrl ? `<img src="${u.avatarUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">` : u.name.charAt(0).toUpperCase();
        el.innerHTML = `<div class="avatar">${avHtml}</div><div class="result-meta"><h4>${escapeHtml(u.name)}</h4><span>@${escapeHtml(u.username)}</span></div>`;
        el.onclick = () => startChat(u);
        box.appendChild(el);
      });
    } catch (e) {
      box.innerHTML = '<p class="no-result">Ошибка поиска</p>';
    }
  };
}

async function startChat(user) {
  state.contacts[user.username] = user;
  state.activeUser = user.username;
  $('searchInput').value = '';
  $('searchResults').classList.add('hidden');
  await openChat(user.username);
  renderChats();
}

async function openChat(otherUsername) {
  const other = state.contacts[otherUsername];
  if (!other) return;
  state.activeUser = otherUsername;
  $('emptyState').classList.add('hidden');
  $('chatView').classList.remove('hidden');
  $('app').classList.add('chat-open');
  
  const avatarHtml = other.avatarUrl ? `<img src="${other.avatarUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">` : other.name.charAt(0).toUpperCase();
  $('chatAvatar').innerHTML = avatarHtml;
  $('chatName').textContent = other.name;
  $('chatUsername').textContent = '@' + other.username;
  await loadMessages(other.uid);
  renderChats();
  setTimeout(() => $('messageInput').focus(), 100);
}

async function loadMessages(otherUid) {
  if (state.unsubMessages) state.unsubMessages();
  const chatId = chatIdFor(state.uid, otherUid);
  const msgRef = collection(db, 'chats', chatId, 'messages');
  const q = query(msgRef, orderBy('createdAt', 'asc'));

  state.unsubMessages = onSnapshot(q, (snap) => {
    const box = $('messages');
    box.innerHTML = '';
    if (snap.empty) {
      box.innerHTML = '<p style="text-align:center;color:#8a8a99;margin-top:20px">Начните диалог 👋</p>';
      return;
    }
    
    snap.forEach(d => {
      const m = d.data();
      const el = document.createElement('div');
      el.className = 'message ' + (m.from === state.uid ? 'own' : 'other');
      const msgTime = m.createdAt?.toDate?.()?.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) || '...';
      el.innerHTML = `${escapeHtml(m.text)}<span class="time">${msgTime}</span>`;
      box.appendChild(el);
    });
    box.scrollTop = box.scrollHeight;
  });
}

async function sendMessage() {
  const input = $('messageInput');
  const text = input.value.trim();
  if (!text || !state.activeUser) return;
  const other = state.contacts[state.activeUser];
  if (!other) return;
  input.value = '';
  const chatId = chatIdFor(state.uid, other.uid);
  try {
    await addDoc(collection(db, 'chats', chatId, 'messages'), { text, from: state.uid, createdAt: serverTimestamp() });
    await setDoc(doc(db, 'chats', chatId), {
      users: [state.uid, other.uid], lastText: text, lastTs: serverTimestamp(),
      [`name_${state.uid}`]: state.me.name, [`name_${other.uid}`]: other.name,
      [`uname_${state.uid}`]: state.me.username, [`uname_${other.uid}`]: other.username,
      [`avatar_${state.uid}`]: state.me.avatarUrl || '', [`avatar_${other.uid}`]: other.avatarUrl || '',
    }, { merge: true });
  } catch (e) { alert('Ошибка: ' + e.message); }
}

function bindComposer() {
  $('sendBtn').onclick = sendMessage;
  $('messageInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
}

function renderChats() {
  const list = $('chatsList');
  list.innerHTML = '';
  const contacts = Object.values(state.contacts);
  if (contacts.length === 0) {
    list.innerHTML = '<p style="text-align:center;color:#8a8a99;padding:20px;font-size:14px">Найдите собеседника через поиск ↑</p>';
    return;
  }
  contacts.forEach(user => {
    const item = document.createElement('div');
    item.className = 'chat-item' + (user.username === state.activeUser ? ' active' : '');
    const avHtml = user.avatarUrl ? `<img src="${user.avatarUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">` : user.name.charAt(0).toUpperCase();
    item.innerHTML = `<div class="avatar">${avHtml}</div><div class="chat-meta"><h4>${escapeHtml(user.name)}</h4><p>@${escapeHtml(user.username)}</p></div>`;
    item.onclick = () => openChat(user.username);
    list.appendChild(item);
  });
}

document.querySelector('.chat-header').addEventListener('click', e => {
  if (window.innerWidth <= 700 && e.target.tagName === 'HEADER') {
    if (state.unsubMessages) state.unsubMessages();
    $('app').classList.remove('chat-open');
    state.activeUser = null;
    $('chatView').classList.add('hidden');
    $('emptyState').classList.remove('hidden');
  }
});

document.addEventListener('click', e => {
  if (!e.target.closest('.search-box') && !e.target.closest('.search-results')) {
    $('searchResults').classList.add('hidden');
  }
});
</script>
