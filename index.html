<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kal</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
body { background: #0e0e11; color: white; height: 100vh; display: flex; flex-direction: column; }
.hidden { display: none !important; }
.auth-screen { height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.auth-card { background: #17171c; padding: 30px; border-radius: 20px; width: 100%; max-width: 350px; text-align: center; }
input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #333; background: #1e1e26; color: white; }
button { width: 100%; padding: 12px; background: #6c5ce7; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
.btn-secondary { background: transparent; color: #888; margin-top: 10px; }
.err { color: #ff6b6b; font-size: 12px; margin-bottom: 10px; min-height: 15px; }
.app { display: flex; flex-direction: column; height: 100vh; }
.header { padding: 15px; background: #17171c; display: flex; justify-content: space-between; align-items: center; }
.chats { flex: 1; overflow-y: auto; padding: 10px; }
.chat-item { padding: 15px; border-bottom: 1px solid #333; cursor: pointer; }
.chat-item:hover { background: #1e1e26; }
.bottom-nav { display: flex; justify-content: space-around; background: #17171c; padding: 10px; border-top: 1px solid #333; }
.nav-item { color: #888; cursor: pointer; display: flex; flex-direction: column; align-items: center; font-size: 12px; }
.nav-item.active { color: #6c5ce7; }
.profile-tab { padding: 20px; flex: 1; display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>

<div id="registerScreen" class="auth-screen hidden">
  <div class="auth-card">
    <h1>Регистрация</h1>
    <input type="text" id="regName" placeholder="Имя" />
    <input type="text" id="regUsername" placeholder="Username" />
    <input type="email" id="regEmail" placeholder="Email" />
    <input type="password" id="regPassword" placeholder="Пароль" />
    <div class="err" id="regErr"></div>
    <button id="registerBtn">Зарегистрироваться</button>
    <button id="goToLogin" class="btn-secondary">Уже есть аккаунт</button>
  </div>
</div>

<div id="loginScreen" class="auth-screen hidden">
  <div class="auth-card">
    <h1>Вход</h1>
    <input type="email" id="logEmail" placeholder="Email" />
    <input type="password" id="logPassword" placeholder="Пароль" />
    <div class="err" id="logErr"></div>
    <button id="loginBtn">Войти</button>
    <button id="goToRegister" class="btn-secondary">Нет аккаунта</button>
  </div>
</div>

<div id="app" class="app hidden">
  <div class="header">
    <b>Kal</b>
    <span id="myTag"></span>
  </div>
  
  <div id="chatsTab" style="flex:1; display:flex; flex-direction:column;">
    <div class="chats" id="chatsList">Нет чатов</div>
  </div>

  <div id="profileTab" class="profile-tab hidden">
    <h2>Профиль</h2>
    <div style="margin-top:20px; width:100%; max-width:300px;">
      <input type="text" id="profileName" placeholder="Имя" />
      <input type="text" id="profileUsername" placeholder="Username" />
      <button id="saveProfileBtn">Сохранить</button>
      <button id="logoutBtn" class="btn-secondary" style="background:#ff6b6b; color:white; margin-top:20px;">Выйти</button>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active" id="navChats">💬 Чаты</div>
    <div class="nav-item" id="navProfile">👤 Профиль</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, getDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDPyoYEsvZTvSSaVUb7pKDyAJzpZLxE3fk",
  authDomain: "kal-is.firebaseapp.com",
  projectId: "kal-is",
  storageBucket: "kal-is.firebasestorage.app",
  messagingSenderId: "267978238420",
  appId: "1:267978238420:web:09f37b1e3a50e3398cce41",
  measurementId: "G-SDY8CJM1CC"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = (id) => document.getElementById(id);
const state = { uid: null, me: null };

onAuthStateChanged(auth, async (user) => {
  if (user) {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (snap.exists()) {
      state.uid = user.uid;
      state.me = snap.data();
      enterApp();
      return;
    }
  }
  $('app').classList.add('hidden');
  $('registerScreen').classList.remove('hidden');
});

function initAuthLogic() {
  $('goToLogin').onclick = () => { $('registerScreen').classList.add('hidden'); $('loginScreen').classList.remove('hidden'); };
  $('goToRegister').onclick = () => { $('loginScreen').classList.add('hidden'); $('registerScreen').classList.remove('hidden'); };

  $('registerBtn').onclick = async () => {
    const name = $('regName').value.trim();
    const username = $('regUsername').value.trim().toLowerCase();
    const email = $('regEmail').value.trim();
    const password = $('regPassword').value;
    const err = $('regErr');
    err.textContent = '';
    
    if (!name || !username || !email || !password) { err.textContent = 'Заполните все поля'; return; }
    $('registerBtn').disabled = true;

    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await setDoc(doc(db, 'users', cred.user.uid), { uid: cred.user.uid, name, username, email });
      await setDoc(doc(db, 'usernames', username), { uid: cred.user.uid });
      location.reload();
    } catch (e) { err.textContent = e.message; }
    finally { $('registerBtn').disabled = false; }
  };

  $('loginBtn').onclick = async () => {
    const email = $('logEmail').value.trim();
    const password = $('logPassword').value;
    const err = $('logErr');
    err.textContent = '';
    if (!email || !password) { err.textContent = 'Введите данные'; return; }
    $('loginBtn').disabled = true;
    try { await signInWithEmailAndPassword(auth, email, password); } 
    catch (e) { err.textContent = 'Неверный логин или пароль'; }
    finally { $('loginBtn').disabled = false; }
  };
}

function enterApp() {
  $('registerScreen').classList.add('hidden');
  $('loginScreen').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('myTag').textContent = '@' + state.me.username;
  
  $('profileName').value = state.me.name;
  $('profileUsername').value = state.me.username;

  $('navChats').onclick = () => {
    $('navChats').classList.add('active'); $('navProfile').classList.remove('active');
    $('chatsTab').classList.remove('hidden'); $('profileTab').classList.add('hidden');
  };
  $('navProfile').onclick = () => {
    $('navProfile').classList.add('active'); $('navChats').classList.remove('active');
    $('profileTab').classList.remove('hidden'); $('chatsTab').classList.add('hidden');
  };

  $('saveProfileBtn').onclick = async () => {
    const newName = $('profileName').value.trim();
    const newUsername = $('profileUsername').value.trim().toLowerCase();
    if (!newName || !newUsername) return alert('Заполните поля');
    
    await setDoc(doc(db, 'users', state.uid), { name: newName, username: newUsername }, { merge: true });
    state.me.name = newName;
    state.me.username = newUsername;
    $('myTag').textContent = '@' + newUsername;
    alert('Сохранено!');
  };

  $('logoutBtn').onclick = async () => {
    await signOut(auth);
    location.reload();
  };
}

initAuthLogic();
</script>
</body>
  </html>
